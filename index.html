<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b63"><title>نظام غياب الطلاب</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="topbar"><div><span class="brand-mark">ح</span><div><h1>نظام غياب الطلاب</h1><p>إدارة الحضور والغياب بسهولة</p></div></div><button id="logoutBtn" class="outline hidden">تسجيل الخروج</button></header>
<main>
<section id="setupNotice" class="notice hidden"></section>
<section id="authView" class="panel auth-panel">
<h2 id="authTitle">تسجيل الدخول</h2><p class="muted">سجّل الدخول للوصول إلى بيانات الطلاب.</p>
<form id="authForm">
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6 أحرف على الأقل"></label>
<button id="authSubmit" class="primary" type="submit">دخول</button>
</form>
<button id="toggleAuth" class="link-button" type="button">ليس لديك حساب؟ أنشئ حسابًا</button>
<p id="authMessage" class="message" aria-live="polite"></p>
</section>
<section id="appView" class="hidden">
<div class="stats">
<article class="stat"><span>إجمالي الطلاب</span><strong id="totalCount">0</strong></article>
<article class="stat"><span>حاضر اليوم</span><strong id="presentCount">0</strong></article>
<article class="stat"><span>غائب اليوم</span><strong id="absentCount">0</strong></article>
</div>
<section class="panel"><h2>إضافة طالب</h2>
<form id="studentForm" class="student-form">
<label>اسم الطالب<input id="studentName" required maxlength="100" placeholder="اسم الطالب"></label>
<label>الفرقة / الفصل<input id="studentGroup" maxlength="60" placeholder="مثال: الفرقة الأولى"></label>
<button class="primary" type="submit">إضافة الطالب</button>
</form></section>
<section class="panel">
<div class="section-heading"><div><h2>سجل الحضور والغياب</h2><p class="muted">اختر التاريخ ثم حدّد حالة كل طالب.</p></div><label class="date-label">التاريخ<input type="date" id="attendanceDate"></label></div>
<div class="toolbar"><input id="searchInput" type="search" placeholder="ابحث باسم الطالب..."><button id="refreshBtn" class="outline" type="button">تحديث</button></div>
<div id="studentsList" class="students-list"><p class="muted">جارٍ تحميل البيانات...</p></div>
</section><p id="appMessage" class="message" aria-live="polite"></p>
</section></main><footer>نظام غياب الطلاب</footer>
</body></html>
